name: Update Posts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"   # 12時間おき

# このワークフローに渡す権限は、README の書き換えに必要な contents: write だけ
permissions:
  contents: write

concurrency:
  group: update-posts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 外部アクションはタグではなくコミットのハッシュで固定する（タグは後から書き換えられるため）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # npm のパッケージは入れない。ランナーに入っている Node だけでフィードを読む
      - name: Generate posts
        run: node .github/scripts/update-posts.mjs

      - name: Commit & Push
        run: |
          git config user.name  "nemdull-bot"
          git config user.email "47370873+nemdull@users.noreply.github.com"
          git diff --quiet || (git add README.md && git commit -m "chore: update posts" && git push)
