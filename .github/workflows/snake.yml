name: Generate Snake
on:
  schedule: [{ cron: "0 0 * * *" }]  # 毎日実行 / run daily
  workflow_dispatch:

# output ブランチへの書き込みに必要な権限だけ
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 外部アクションはタグではなくコミットのハッシュで固定する（タグは後から書き換えられるため）
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: nemdull
          outputs: dist/github-contribution-grid-snake.svg

      - name: Push snake
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
